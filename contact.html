<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="logo"><img src="images/logo-white.png" alt="K.K.SAKUMA" class="logo-img"></a>
    <nav class="gnav">
      <a href="index.html">ホーム</a>
      <div class="has-drop">
        <a href="#">事業紹介</a>
        <div class="drop">
          <a href="kojin.html">個人様向け</a>
          <a href="hojin.html">法人様向け</a>
        </div>
      </div>
      <a href="company.html">会社概要</a>
      <a href="message.html">代表挨拶</a>
      <a href="results.html">実績紹介</a>
      <a href="recruit.html">採用情報</a>
      <a href="contact.html" class="btn-nav is-active">お問い合わせ</a>
    </nav>
  </div>
</header>

<div class="wrap breadcrumb"><a href="index.html">ホーム</a> ／ お問い合わせ</div>

<div class="wrap page-head reveal">
  <span class="eyebrow">Contact</span>
  <h1 class="display">お問い合わせ</h1>
  <p style="max-width:640px;color:#3c3f45;">
    個人様向けサービス・法人様向けサービスに関するご相談、取材、採用など、お気軽にご連絡ください。
    <span class="placeholder">（フォームは下書きです。送信先メールアドレスの設定が必要です）</span>
  </p>
</div>

<section class="section tight">
  <div class="wrap reveal" style="max-width:640px;">
    <form onsubmit="return false;" style="display:flex;flex-direction:column;gap:22px;">
      <label style="font-size:14px;">
        お名前
        <input type="text" placeholder="山田 太郎" style="width:100%;margin-top:8px;padding:14px;border:1px solid var(--line);background:var(--canvas);font-family:inherit;font-size:15px;">
      </label>
      <label style="font-size:14px;">
        メールアドレス
        <input type="email" placeholder="you@example.com" style="width:100%;margin-top:8px;padding:14px;border:1px solid var(--line);background:var(--canvas);font-family:inherit;font-size:15px;">
      </label>
      <label style="font-size:14px;">
        お問い合わせ区分
        <select style="width:100%;margin-top:8px;padding:14px;border:1px solid var(--line);background:var(--canvas);font-family:inherit;font-size:15px;">
          <option>個人様向けについて</option>
          <option>法人様向けについて</option>
          <option>取材・メディア掲載について</option>
          <option>採用について</option>
          <option>その他</option>
        </select>
      </label>
      <label style="font-size:14px;">
        お問い合わせ内容
        <textarea rows="6" placeholder="お問い合わせ内容をご記入ください" style="width:100%;margin-top:8px;padding:14px;border:1px solid var(--line);background:var(--canvas);font-family:inherit;font-size:15px;resize:vertical;"></textarea>
      </label>
      <button type="submit" class="btn btn-dark" style="align-self:flex-start;">送信する（下書き・未接続）</button>
    </form>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">

      <a href="contact.html">お問い合わせ</a>
    </div>
    <div class="copyright">Copyright © 株式会社佐久間 All Rights Reserved.（下書きサイト）</div>
  </div>
</footer>

</body>
</html>
